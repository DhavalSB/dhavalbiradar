{% extends "base.html" %}

{% block extra_head %}
<script src="/js/carousel.js" defer></script>
{% endblock extra_head %}

{% block content %}

<a href="/photos" class="header-image" id="hero-carousel">
  <img class="is-active" src="/images/gallery/fullsrc/shore.jpeg" alt="Aerial view of a rocky coastline">
  <img src="/images/gallery/fullsrc/Plane.jpeg" alt="Airplane wing over clouds at sunset">
  <img src="/images/gallery/showcase/bay-tour/ggmain.jpeg" alt="Golden Gate Bridge from above">
</a>

<div class="section-ellipsis" role="tablist" aria-label="Featured photos">
  <button type="button" class="carousel-dot active" role="tab" aria-selected="true" aria-label="Coastline"></button>
  <button type="button" class="carousel-dot" role="tab" aria-selected="false" aria-label="Airplane at sunset"></button>
  <button type="button" class="carousel-dot" role="tab" aria-selected="false" aria-label="Golden Gate Bridge"></button>
</div>

<div class="main-directory link-slide">
  <a href="/photos">
    <div class="main-directory-link">
      <h1>photos</h1>
          <span class="material-symbols-outlined" style="font-size: 50%;">arrow_forward_ios</span>
    </div>
    <p> Aug 25, 2026 </p>
  </a>
</div>
<div class="main-directory link-slide">
  <a href="/writing">
    <div class="main-directory-link">
      <h1>words</h1>
          <span class="material-symbols-outlined" style="font-size: 50%;">arrow_forward_ios</span>
    </div>
    <p> Feb 28, 2026 </p>
  </a>
</div>
<div class="main-directory link-slide">
  <a href="/now">
    <div class="main-directory-link">
      <h1>now</h1>
          <span class="material-symbols-outlined" style="font-size: 50%;">arrow_forward_ios</span>
    </div>
    <p> Aug 25, 2026 </p>
  </a>
</div>
{% endblock content %}
