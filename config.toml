# The URL the site will be built for
base_url = "https://dhavalbiradar.com"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# RSS/Atom feed
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
# Syntax highlighting (Zola 0.22+)
[markdown.highlighting]
theme = "github-dark"

[extra]
# Origin of the METAR map API (no trailing slash). Empty = same origin.
# After `wrangler deploy`, set this to the printed workers.dev origin so
# https://dhavalbiradar.com/metar-map can reach the API from GitHub Pages.
metar_map_api_origin = "https://dhavalbiradar-metar-map.dhavalbiradar.workers.dev"
