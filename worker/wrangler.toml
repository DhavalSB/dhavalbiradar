name = "dhavalbiradar-metar-map"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true

# 1. npx wrangler d1 create metar-map
# 2. paste the returned database_id below
# 3. npx wrangler secret put METAR_MAP_DEVICE_TOKEN
# 4. npx wrangler secret put METAR_MAP_PASSWORD
# 5. npx wrangler secret put SESSION_SECRET
# 6. npm run deploy
[[d1_databases]]
binding = "DB"
database_name = "metar-map"
database_id = "0ede0354-c62b-41a1-874c-de4edefae78c"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
